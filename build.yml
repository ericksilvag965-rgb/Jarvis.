name: github/workflows/build.yml
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Montar projeto
        run: |
          mkdir -p app/src/main/java/com/jarvis/app
          cp AndroidManifest.xml app/src/main/
          cp MainActivity.kt JarvisService.kt app/src/main/java/com/jarvis/app/
          cp app-build.gradle.kts app/build.gradle.kts
      - name: Compilar
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Jarvis-APK
          path: app/build/outputs/apk/debug/app-debug.apk
